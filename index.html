          "<circle cx='256' cy='246' r='6' fill='%2300e5ff'/>" +

        );

        const manifestObj = {
          name: "CAD Workshop 3D",
          short_name: "CAD 3D",
          start_url: "./index.html",
          scope: "./",
          display: "standalone",
          orientation: "any",
          background_color: "#e2e8f0",

          description: "Simulador interactivo 3D de ensamble y desensamble mecánico con visualización CAD.",

            },
            {
              src: svgIconData,
              sizes: "512x512",
              type: "image/svg+xml",
              purpose: "any"
            },
            {
              src: svgIconData,
              sizes: "512x512",
              type: "image/svg+xml",
              purpose: "maskable"
            }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestUrl;
        document.head.appendChild(link);
      })();

    <!-- 2. Service Worker Inline / Autocontenido con script Blob (Cache 'cad-pwa-v1' y 100% Offline-Ready) -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            const swCode = `
              const CACHE_NAME = 'cad-pwa-v1';
              const OFFLINE_URLS = [
                './',
                './index.html',
                'https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap'
              ];

              self.addEventListener('install', (event) => {
                event.waitUntil(
                  caches.open(CACHE_NAME).then((cache) => {
                    return cache.addAll(OFFLINE_URLS).catch((err) => {
                      console.warn('[PWA] Cache pre-fill partial:', err);
                    });
                  }).then(() => self.skipWaiting())
                );
              });

              self.addEventListener('activate', (event) => {
                event.waitUntil(
                  caches.keys().then((keys) =>
                    Promise.all(
                      keys.map((key) => {
                        if (key !== CACHE_NAME) return caches.delete(key);
                      })
                    )
                  ).then(() => self.clients.claim())
                );
              });

              self.addEventListener('fetch', (event) => {
                if (event.request.method !== 'GET') return;
                event.respondWith(
                  caches.match(event.request).then((cachedResponse) => {
                    if (cachedResponse) {
                      return cachedResponse;
                    }
                    return fetch(event.request)
                      .then((networkResponse) => {
                        if (!networkResponse || networkResponse.status !== 200 || networkResponse.type === 'opaque') {
                          return networkResponse;
                        }
                        const responseToCache = networkResponse.clone();
                        caches.open(CACHE_NAME).then((cache) => {
                          cache.put(event.request, responseToCache);
                        });
                        return networkResponse;
                      })
                      .catch(() => {
                        return caches.match('./index.html') || caches.match('./');
                      });
                  })
                );
              });
            `;

            try {
              const swBlob = new Blob([swCode], { type: 'application/javascript' });
              const swUrl = URL.createObjectURL(swBlob);
              navigator.serviceWorker.register(swUrl)
                .then(function(reg) {
                  // SW registered successfully
                })
                .catch(function(err) {
                  console.warn('[PWA] Service Worker registration skipped:', err);
                });
            } catch (err) {
              console.warn('[PWA] Blob Service Worker not supported:', err);
            }
          });
        }
      })();
    </script>
